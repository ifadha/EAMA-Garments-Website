<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EAMA Dashboard | Client Portal</title>
    <!-- Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;500&display=swap');

        :root {
            --bg-main: #121414;
            --bg-surface: #1E2020;
            --bg-elevated: #292A2A;
            --text-primary: #E3E2E2;
            --text-secondary: #E1BFB8;
            --text-muted: #A88A83;
            --accent: #FF6B4A;
            --font-heading: 'Playfair Display', serif;
            --font-body: 'Inter', sans-serif;
            --status-pending: #E1BFB8;
            --status-progress: #FF6B4A;
            --status-complete: #88A883;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: var(--font-body);
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* Top Bar */
        .top-bar {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--bg-elevated);
        }
        .logo { font-family: var(--font-heading); font-size: 1.5rem; letter-spacing: 2px; }
        .user-meta { font-size: 0.8rem; color: var(--text-muted); text-align: right; }

        .dashboard-container { max-width: 1200px; margin: 0 auto; padding: 40px; }

        /* Welcome Section */
        .welcome-header { margin-bottom: 48px; }
        .welcome-header h1 { font-family: var(--font-heading); font-size: 2.5rem; margin: 0 0 8px 0; font-weight: 400; }
        .welcome-header p { color: var(--text-muted); margin: 0; }

        /* Summary Grid */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 50px;
        }
        .summary-card {
            background: var(--bg-surface);
            border: 1px solid var(--bg-elevated);
            padding: 24px;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s;
        }
        .summary-card:hover { border-color: var(--accent); transform: translateY(-2px); }
        .summary-card h3 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-secondary); margin: 0 0 20px 0; }
        .stat-main { font-family: var(--font-heading); font-size: 2rem; display: block; margin-bottom: 10px; }
        .stat-details { font-size: 0.75rem; color: var(--text-muted); display: flex; gap: 10px; }
        .stat-details span b { color: var(--text-primary); }

        /* Table Section */
        .section-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; }
        .section-header h2 { font-family: var(--font-heading); font-size: 1.5rem; margin: 0; font-weight: 400; }
        
        .request-table-container { background: var(--bg-surface); border: 1px solid var(--bg-elevated); border-radius: 4px; overflow: hidden; }
        .request-table { width: 100%; border-collapse: collapse; }
        .request-table th {
            text-align: left;
            padding: 16px 24px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            border-bottom: 1px solid var(--bg-elevated);
        }
        .request-table td {
            padding: 20px 24px;
            font-size: 0.9rem;
            border-bottom: 1px solid var(--bg-elevated);
            cursor: pointer;
            transition: background 0.2s;
        }
        .request-table tr:last-child td { border-bottom: none; }
        .request-table tr:hover td { background: rgba(255,107,74,0.04); }
        
        .badge {
            padding: 4px 10px;
            border-radius: 2px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            background: var(--bg-elevated);
        }
        .badge.pending { color: var(--status-pending); border: 1px solid var(--status-pending); }
        .badge.progress { color: var(--status-progress); border: 1px solid var(--status-progress); }
        .badge.complete { color: var(--status-complete); border: 1px solid var(--status-complete); }

        /* Overlay */
        .overlay {
            position: fixed;
            top: 0; right: -100%;
            width: 100%; max-width: 650px;
            height: 100%;
            background: var(--bg-surface);
            box-shadow: -20px 0 60px rgba(0,0,0,0.8);
            z-index: 1000;
            transition: right 0.45s cubic-bezier(0.16, 1, 0.3, 1);
            overflow-y: auto;
            border-left: 1px solid var(--bg-elevated);
        }
        .overlay.active { right: 0; }
        .overlay-content { padding: 40px; }
        .close-overlay { cursor: pointer; color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; margin-bottom: 30px; display: inline-block; transition: color 0.2s; }
        .close-overlay:hover { color: var(--accent); }

        /* Timeline */
        .timeline { display: flex; justify-content: space-between; margin: 40px 0; position: relative; }
        .timeline::before { content: ''; position: absolute; top: 15px; left: 0; width: 100%; height: 1px; background: var(--bg-elevated); z-index: 1; }
        .timeline-step { position: relative; z-index: 2; text-align: center; flex: 1; }
        .step-dot { width: 30px; height: 30px; background: var(--bg-elevated); border-radius: 50%; border: 2px solid var(--bg-surface); margin: 0 auto 8px auto; transition: background 0.3s; }
        .timeline-step.active .step-dot { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 15px rgba(255,107,74,0.3); }
        .timeline-step.completed .step-dot { background: var(--status-complete); border-color: var(--status-complete); }
        .step-label { font-size: 0.65rem; text-transform: uppercase; color: var(--text-muted); }
        .timeline-step.active .step-label { color: var(--text-primary); font-weight: 600; }

        /* Detail Grid */
        .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 30px; padding: 24px; background: var(--bg-main); border-radius: 4px; }
        .detail-item label { display: block; font-size: 0.7rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 4px; letter-spacing: 0.05em; }
        .detail-item p { margin: 0; font-size: 0.95rem; color: var(--text-primary); }

        /* Communication */
        .message-thread { background: var(--bg-main); padding: 24px; border-radius: 4px; margin-top: 40px; }
        .message-list { max-height: 400px; overflow-y: auto; margin-bottom: 20px; }
        .message { margin-bottom: 20px; border-bottom: 1px solid var(--bg-elevated); padding-bottom: 15px; }
        .message:last-child { border-bottom: none; }
        .message-meta { font-size: 0.7rem; color: var(--text-secondary); margin-bottom: 5px; display: flex; justify-content: space-between; }
        .message-text { font-size: 0.9rem; color: var(--text-primary); line-height: 1.6; }
        .reply-box { display: flex; gap: 10px; background: var(--bg-elevated); padding: 6px; border-radius: 4px; }
        .reply-box input { flex-grow: 1; background: transparent; border: none; padding: 12px; color: white; outline: none; font-size: 0.9rem; }
        .reply-box button { background: var(--accent); border: none; padding: 0 25px; color: white; border-radius: 2px; cursor: pointer; font-weight: 600; text-transform: uppercase; font-size: 0.75rem; transition: opacity 0.2s; }
        .reply-box button:hover { opacity: 0.9; }

        /* Loading Skeleton */
        .skeleton { background: linear-gradient(90deg, var(--bg-elevated) 25%, var(--bg-surface) 50%, var(--bg-elevated) 75%); background-size: 200% 100%; animation: loading 1.5s infinite; }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        /* Document Item */
        .doc-item { background: var(--bg-elevated); padding: 12px 16px; margin-top: 8px; font-size: 0.8rem; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; border: 1px solid transparent; transition: border 0.2s; }
        .doc-item:hover { border-color: var(--accent); }
        .doc-link { color: var(--accent); text-decoration: none; font-weight: 600; text-transform: uppercase; font-size: 0.7rem; }

        @media (max-width: 900px) {
            .summary-grid { grid-template-columns: 1fr 1fr; }
            .dashboard-container { padding: 20px; }
            .overlay { max-width: 100%; }
        }
    </style>
</head>
<body>

    <nav class="top-bar">
        <div class="logo">EAMA GARMENTS</div>
        <div class="user-meta" id="client-info">
            <div class="skeleton" style="height: 15px; width: 120px; margin-bottom: 5px;"></div>
            <div class="skeleton" style="height: 12px; width: 80px;"></div>
        </div>
    </nav>

    <main class="dashboard-container">
        
        <section class="welcome-header" id="welcome-section">
            <h1 class="skeleton" style="height: 45px; width: 300px; margin-bottom: 15px;"></h1>
            <p class="skeleton" style="height: 20px; width: 200px;"></p>
        </section>

        <!-- Summary Cards -->
        <div class="summary-grid" id="summary-grid">
            <!-- Rendered via JS -->
            <div class="summary-card skeleton" style="height: 140px;"></div>
            <div class="summary-card skeleton" style="height: 140px;"></div>
            <div class="summary-card skeleton" style="height: 140px;"></div>
            <div class="summary-card skeleton" style="height: 140px;"></div>
        </div>

        <!-- Recent Activity -->
        <div class="section-header">
            <h2>Unified Request History</h2>
            <div style="font-size: 0.8rem; color: var(--text-muted);">
                <input type="text" id="search-requests" placeholder="Search requests..." style="background: var(--bg-surface); border: 1px solid var(--bg-elevated); color: white; padding: 8px 15px; border-radius: 4px; outline: none;">
            </div>
        </div>
        
        <div class="request-table-container">
            <table class="request-table">
                <thead>
                    <tr>
                        <th>Reference</th>
                        <th>Type</th>
                        <th>Subject / Product</th>
                        <th>Submission Date</th>
                        <th>Current Status</th>
                    </tr>
                </thead>
                <tbody id="request-list">
                    <!-- Data will be injected here -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Slide-over Overlay -->
    <div id="detail-overlay" class="overlay">
        <div class="overlay-content" id="overlay-body">
            <!-- Content injected on selection -->
        </div>
    </div>

    <script>
        /**
         * EAMA Client Portal - Production Module
         */
        const App = {
            client: null,
            requests: [],
            activeRequest: null,
            realtimeChannel: null,

            async init() {
    try {
        // ---------------------------------------------------------
        // 1. Check authentication
        // ---------------------------------------------------------

        const {
            data: { session }
        } = await eamaSupabase.auth.getSession();

        if (!session) {
            window.location.href = 'client-portal-sign-in.html';
            return;
        }

        // ---------------------------------------------------------
        // 2. Identify Client Record
        // ---------------------------------------------------------

        const {
            data: clientData,
            error: clientErr
        } = await eamaSupabase
            .from('clients')
            .select('*')
            .eq('email', session.user.email)
            .single();

        if (clientErr || !clientData) {
            throw new Error("Client record not found.");
        }

        this.client = clientData;

        // ---------------------------------------------------------
        // 3. Render Profile Header
        // ---------------------------------------------------------

        this.renderProfile();

        // ---------------------------------------------------------
        // 4. Load Dashboard Data
        // ---------------------------------------------------------

        await this.loadDashboardData();

        // ---------------------------------------------------------
        // 5. Check whether a specific request was requested
        //    through the email link.
        //
        // Example:
        //
        // client-dashboard.html?request_id=xxxxxxxx
        // ---------------------------------------------------------

        const urlParams = new URLSearchParams(
            window.location.search
        );

        const requestedId =
            urlParams.get('request_id');

        if (requestedId) {

            console.log(
                'Request ID received from URL:',
                requestedId
            );

            // -----------------------------------------------------
            // 6. Find the request inside THIS client's requests
            //
            // This is important for security.
            //
            // We do NOT simply open whatever ID is in the URL.
            // The request must already exist in this client's
            // loaded request list.
            // -----------------------------------------------------

            const requestedRequest =
                this.requests.find(
                    request => request.id === requestedId
                );

            if (requestedRequest) {

                console.log(
                    'Opening requested manufacturing request:',
                    requestedRequest.id
                );

                // Automatically open the request details
                await this.openDetails(
                    requestedRequest.id
                );

            } else {

                console.warn(
                    'Requested request was not found in the authenticated client account:',
                    requestedId
                );

                alert(
                    'The requested request could not be found in your client portal.'
                );
            }
        }

    } catch (err) {

        console.error(
            "Initialization Error:",
            err
        );

        alert(
            "Unable to load profile. Please contact support."
        );
    }
},

            renderProfile() {
                const info = document.getElementById('client-info');
                info.innerHTML = `
                    <b>${this.client.company_name}</b><br>
                    ${this.client.contact_person}
                `;

                const welcome = document.getElementById('welcome-section');
                welcome.innerHTML = `
                    <h1>Welcome, ${this.client.contact_person.split(' ')[0]}</h1>
                    <p>Track your manufacturing and design progress in real-time.</p>
                `;
            },

            async loadDashboardData() {
                // Fetch Manufacturing + Inquiries + Visits
                const [mfg, inquiries, visits] = await Promise.all([
                    eamaSupabase.from('manufacturing_requests').select('*').eq('email', this.client.email).order('created_at', {ascending: false}),
                    eamaSupabase.from('inquiries').select('*').eq('email', this.client.email).order('created_at', {ascending: false}),
                    eamaSupabase.from('factory_visits').select('*').eq('email', this.client.email).order('created_at', {ascending: false})
                ]);

                // Unify into a single ERP object structure
                this.requests = [
                    ...(mfg.data || []).map(r => ({...r, unified_type: 'Manufacturing', subject: r.garment_category || 'Custom Request'})),
                    ...(inquiries.data || []).map(r => ({...r, unified_type: 'General Inquiry', subject: 'Platform Inquiry'})),
                    ...(visits.data || []).map(r => ({...r, unified_type: 'Factory Visit', subject: `Visit: ${r.purpose_of_visit}`}))
                ].sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

                this.renderSummary();
                this.renderTable(this.requests);
            },

            renderSummary() {
                const stats = {
                    mfg: this.requests.filter(r => r.unified_type === 'Manufacturing').length,
                    visits: this.requests.filter(r => r.unified_type === 'Factory Visit').length,
                    pending: this.requests.filter(r => r.status === 'New' || r.status === 'Pending').length,
                    active: this.requests.filter(r => r.status === 'Processing' || r.status === 'Sampling').length
                };

                document.getElementById('summary-grid').innerHTML = `
                    <div class="summary-card">
                        <h3>Manufacturing</h3>
                        <span class="stat-main">${String(stats.mfg).padStart(2, '0')}</span>
                        <div class="stat-details"><span>Total Submissions</span></div>
                    </div>
                    <div class="summary-card">
                        <h3>In Progress</h3>
                        <span class="stat-main">${String(stats.active).padStart(2, '0')}</span>
                        <div class="stat-details"><span>Active Projects</span></div>
                    </div>
                    <div class="summary-card">
                        <h3>Factory Visits</h3>
                        <span class="stat-main">${String(stats.visits).padStart(2, '0')}</span>
                        <div class="stat-details"><span>Booked Sessions</span></div>
                    </div>
                    <div class="summary-card">
                        <h3>Attention Required</h3>
                        <span class="stat-main">${String(stats.pending).padStart(2, '0')}</span>
                        <div class="stat-details"><span>Pending Review</span></div>
                    </div>
                `;
            },

            renderTable(data) {
                const list = document.getElementById('request-list');
                if (data.length === 0) {
                    list.innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 40px; color: var(--text-muted);">No active requests found.</td></tr>`;
                    return;
                }

                list.innerHTML = data.map(r => `
                    <tr onclick="App.openDetails('${r.id}')">
                        <td>#${String(r.id).slice(0, 8).toUpperCase()}</td>
                        <td style="color: var(--text-secondary)">${r.unified_type}</td>
                        <td>${r.subject}</td>
                        <td>${new Date(r.created_at).toLocaleDateString(undefined, {month: 'short', day: 'numeric', year: 'numeric'})}</td>
                        <td><span class="badge ${this.getStatusClass(r.status)}">${r.status}</span></td>
                    </tr>
                `).join('');
            },

            getStatusClass(status) {
                const s = status.toLowerCase();
                if (['new', 'pending', 'review'].includes(s)) return 'pending';
                if (['completed', 'shipped', 'confirmed'].includes(s)) return 'complete';
                return 'progress';
            },

            async openDetails(id) {
                const r = this.requests.find(req => req.id === id);
                this.activeRequest = r;

                const overlay = document.getElementById('detail-overlay');
                const body = document.getElementById('overlay-body');
                
                overlay.classList.add('active');
                body.innerHTML = `<div class="skeleton" style="height: 400px; width: 100%;"></div>`;

                // Fetch documents and messages
                const [{data: docs}, {data: msgs, error: messagesError}] = await Promise.all([
                    eamaSupabase.from('documents').select('*').eq('manufacturing_request_id', r.id),
                    eamaSupabase.from('request_messages').select('*').eq('request_id', r.id).order('created_at', {ascending: true})
                ]);

                if (messagesError) {
                    console.error('Unable to load request messages:', messagesError);
                }

                this.renderDetailView(r, docs, Array.isArray(msgs) ? msgs : []);
                this.initRealtime(r.id);
            },

            renderDetailView(r, docs, msgs) {
                const body = document.getElementById('overlay-body');
                const statusMap = ['New', 'Technical Review', 'Sampling', 'Production', 'Completed'];
                const currentIndex = statusMap.indexOf(r.status);
                const safeMsgs = Array.isArray(msgs) ? msgs : [];

                body.innerHTML = `
                    <span class="close-overlay" onclick="App.closeDetails()">← Back to Dashboard</span>
                    
                    <h2 style="font-family: var(--font-heading); font-size: 2rem; margin: 0;">#${String(r.id).slice(0, 8).toUpperCase()}</h2>
                    <p style="color: var(--text-secondary); margin: 5px 0 30px 0;">${r.unified_type}: ${r.subject}</p>

                    <div class="timeline">
                        ${statusMap.map((s, i) => `
                            <div class="timeline-step ${i === currentIndex ? 'active' : (i < currentIndex ? 'completed' : '')}">
                                <div class="step-dot"></div>
                                <div class="step-label">${s.split(' ')[0]}</div>
                            </div>
                        `).join('')}
                    </div>

                    <div class="detail-grid">
                        <div class="detail-item"><label>Garment Category</label><p>${r.garment_category || 'N/A'}</p></div>
                        <div class="detail-item"><label>Production Qty</label><p>${r.target_quantity || 'N/A'} Pieces</p></div>
                        <div class="detail-item"><label>Fabric Spec</label><p>${r.fabric_preference || 'Standard'}</p></div>
                        <div class="detail-item"><label>Target Timeline</label><p>${r.production_timeline || 'TBD'}</p></div>
                        <div class="detail-item" style="grid-column: span 2;">
                            <label>Internal Updates</label>
                            <p style="font-size: 0.85rem; line-height: 1.5; color: var(--text-muted);">${r.admin_notes || 'Your request is currently undergoing technical validation.'}</p>
                        </div>
                        <div class="detail-item" style="grid-column: span 2;">
                            <label>Associated Documents</label>
                            ${docs && docs.length > 0 ? docs.map(d => `
                                <div class="doc-item">
                                    <span>${d.file_name}</span>
                                    <a href="${d.file_url}" target="_blank" class="doc-link">View File</a>
                                </div>
                            `).join('') : '<p style="font-size: 0.8rem; color: var(--text-muted);">No documents shared yet.</p>'}
                        </div>
                    </div>

                    <div class="message-thread">
                        <h4 style="margin: 0 0 15px 0; font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase;">Direct Communication</h4>
                        <div class="message-list" id="msg-list">
                            ${safeMsgs.length > 0 ? safeMsgs.map(m => this.createMessageHTML(m)).join('') : '<p id="no-msgs" style="font-size: 0.85rem; color: var(--text-muted); text-align: center; padding: 20px;">No messages yet. Start the conversation below.</p>'}
                        </div>
                        <div class="reply-box">
                            <input type="text" id="reply-input" placeholder="Inquire about this project...">
                            <button onclick="App.sendMessage()">Send</button>
                        </div>
                    </div>
                `;
                
                // Scroll to bottom
                const list = document.getElementById('msg-list');
                list.scrollTop = list.scrollHeight;
            },

            createMessageHTML(m) {
                const isClient = m.sender_type === 'client';
                return `
                    <div class="message">
                        <div class="message-meta">
                            <span>${isClient ? 'You' : 'EAMA Team'}</span>
                            <span>${new Date(m.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                        </div>
                        <div class="message-text" style="${isClient ? 'color: var(--text-secondary)' : ''}">${m.message}</div>
                    </div>
                `;
            },

            async sendMessage() {
                const input = document.getElementById('reply-input');
                const text = input.value.trim();
                if (!text) return;

                const payload = {
                    request_id: this.activeRequest.id,
                    sender_email: this.client.email,
                    sender_type: 'client',
                    message: text
                };

                const { error } = await eamaSupabase.from('request_messages').insert([payload]);
                if (error) UI.toast("Failed to send message.");
                else input.value = '';
            },

            initRealtime(requestId) {
                if (this.realtimeChannel) eamaSupabase.removeChannel(this.realtimeChannel);

                this.realtimeChannel = eamaSupabase.channel('public:request_messages')
                    .on('postgres_changes', { 
                        event: 'INSERT', 
                        schema: 'public', 
                        table: 'request_messages',
                        filter: `request_id=eq.${requestId}` 
                    }, payload => {
                        const list = document.getElementById('msg-list');
                        const noMsgs = document.getElementById('no-msgs');
                        if (noMsgs) noMsgs.remove();
                        
                        list.insertAdjacentHTML('beforeend', this.createMessageHTML(payload.new));
                        list.scrollTop = list.scrollHeight;
                    })
                    .subscribe();
            },

            closeDetails() {
                document.getElementById('detail-overlay').classList.remove('active');
                if (this.realtimeChannel) eamaSupabase.removeChannel(this.realtimeChannel);
            }
        };

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => App.init());

        // Close on ESC
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') App.closeDetails(); });
    </script>
</body>
</html>
