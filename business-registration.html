<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Client Registration | EAMA Garments</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1" rel="stylesheet"/>
    <style>
        body { background-color: #0A0A0A; color: #e3e2e2; font-family: 'Inter', sans-serif; }
        .glass-input { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); transition: all 0.3s ease; }
        .glass-input:focus { background: rgba(255, 255, 255, 0.07); border-color: #ffb4a3; outline: none; }
        #country-list { position: absolute; width: 100%; max-height: 200px; overflow-y: auto; background: #1e2020; border: 1px solid #343535; z-index: 50; display: none; }
        .country-option { padding: 10px 15px; cursor: pointer; font-size: 14px; }
        .country-option:hover { background: #343535; color: #ffb4a3; }
    </style>
</head>
<body class="overflow-x-hidden">
<main class="min-h-screen flex flex-col md:flex-row">
    <!-- Visual Section -->
    <section class="hidden md:flex md:w-5/12 lg:w-1/2 relative flex-col justify-between p-20 border-r border-white/10 overflow-hidden">
        <div class="absolute inset-0 z-0">
            <div class="w-full h-full bg-cover bg-center opacity-30" style="background-image: url('https://images.unsplash.com/photo-1558769132-cb1aea458c5e?q=80&w=2000')"></div>
            <div class="absolute inset-0 bg-gradient-to-b from-transparent to-black"></div>
        </div>
        <div class="relative z-10"><h2 class="text-2xl font-serif text-[#ffb4a3]">EAMA Garments</h2></div>
        <div class="relative z-10">
            <h1 class="text-6xl font-serif leading-tight mb-6">Partner with<br>Industrial Excellence.</h1>
            <p class="text-gray-400 max-w-sm">Access our supply chain infrastructure and manage your production lifecycle from one secure portal.</p>
        </div>
        <div class="relative z-10 text-[10px] tracking-[0.3em] uppercase opacity-40">ISO 9001:2015 CERTIFIED</div>
    </section>

    <!-- Form Section -->
    <section class="flex-1 bg-[#121414] flex items-center justify-center p-8 md:p-20">
        <div class="max-w-xl w-full" id="signup-container">
            <div class="mb-10">
                <h2 class="text-3xl font-serif mb-2">Client Registration</h2>
                <p class="text-gray-500">Create your corporate profile to begin manufacturing.</p>
            </div>

            <form id="registration-form" class="space-y-5">
                <div id="global-error" class="hidden bg-red-900/20 border border-red-500/50 p-4 text-red-200 text-sm mb-6"></div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label class="text-[10px] uppercase tracking-widest text-gray-500 mb-1 block">Company Name</label>
                        <input id="company_name" type="text" class="w-full glass-input p-4 text-sm" placeholder="Enter Business Name" required>
                    </div>
                    <div>
                        <label class="text-[10px] uppercase tracking-widest text-gray-500 mb-1 block">Contact Person</label>
                        <input id="contact_person" type="text" class="w-full glass-input p-4 text-sm" placeholder="Full Name" required>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label class="text-[10px] uppercase tracking-widest text-gray-500 mb-1 block">Business Email</label>
                        <input id="email" type="email" class="w-full glass-input p-4 text-sm" placeholder="name@company.com" required>
                    </div>
                    <div>
                        <label class="text-[10px] uppercase tracking-widest text-gray-500 mb-1 block">Phone Number</label>
                        <input id="phone" type="tel" class="w-full glass-input p-4 text-sm" placeholder="+1 (000) 000-0000">
                    </div>
                </div>

                <div class="relative">
                    <label class="text-[10px] uppercase tracking-widest text-gray-500 mb-1 block">Country</label>
                    <input id="country-search" type="text" class="w-full glass-input p-4 text-sm" placeholder="Search countries..." autocomplete="off" required>
                    <div id="country-list"></div>
                    <input type="hidden" id="selected-country">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label class="text-[10px] uppercase tracking-widest text-gray-500 mb-1 block">Password</label>
                        <input id="password" type="password" class="w-full glass-input p-4 text-sm" placeholder="••••••••" required>
                    </div>
                    <div>
                        <label class="text-[10px] uppercase tracking-widest text-gray-500 mb-1 block">Confirm Password</label>
                        <input id="confirm_password" type="password" class="w-full glass-input p-4 text-sm" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="pt-4">
                    <button type="submit" id="submit-btn" class="w-full bg-[#ffb4a3] text-[#3d0600] font-bold py-5 tracking-widest uppercase hover:bg-white transition-all disabled:opacity-50">
                        Create Account
                    </button>
                </div>

                <p class="text-center text-xs text-gray-500 mt-6">
                    Already have an account? <a href="client-portal-sign-in.html" class="text-[#ffb4a3] hover:underline">Sign In</a>
                </p>
            </form>
        </div>
    </section>
</main>

<script>
    // Country logic
    const countrySearch = document.getElementById('country-search');
    const countryList = document.getElementById('country-list');
    const countries = ["Afghanistan", "Albania", "Algeria", "Argentina", "Australia", "Bangladesh", "Belgium", "Brazil", "Canada", "China", "Egypt", "France", "Germany", "India", "Italy", "Japan", "Mexico", "Netherlands", "Pakistan", "Singapore", "South Africa", "Spain", "Sri Lanka", "Turkey", "UAE", "United Kingdom", "United States"];

    countrySearch.addEventListener('input', (e) => {
        const val = e.target.value.toLowerCase();
        const filtered = countries.filter(c => c.toLowerCase().includes(val));
        countryList.innerHTML = filtered.map(c => `<div class="country-option">${c}</div>`).join('');
        countryList.style.display = filtered.length ? 'block' : 'none';
        
        document.querySelectorAll('.country-option').forEach(opt => {
            opt.addEventListener('click', () => {
                countrySearch.value = opt.innerText;
                countryList.style.display = 'none';
            });
        });
    });

    // Registration logic
    // Registration logic
document.getElementById('registration-form').addEventListener('submit', async (e) => {
    e.preventDefault();

    const btn = document.getElementById('submit-btn');
    const errEl = document.getElementById('global-error');

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirm_password').value;

    if (password !== confirmPassword) {
        errEl.innerText = "Passwords do not match.";
        errEl.classList.remove('hidden');
        return;
    }

    btn.disabled = true;
    btn.innerText = "Creating Account...";

    try {

        // 1. Create Supabase Auth account
        const redirectUrl = window.location.origin + "/client-portal-sign-in.html";

        const { data: authData, error: authError } = await eamaSupabase.auth.signUp({
            email,
            password,
            options: {
                emailRedirectTo: redirectUrl
            }
        });

        if (authError) throw authError;


        // 2. Save client information
        const { error: dbError } = await eamaSupabase
            .from('clients')
            .insert([{
                id: authData.user.id,
                company_name: document.getElementById('company_name').value,
                contact_person: document.getElementById('contact_person').value,
                email: email,
                phone: document.getElementById('phone').value,
                country: countrySearch.value,
                client_status: 'Lead'
            }]);


        if (dbError) throw dbError;


        // 3. Show confirmation message
        document.getElementById('signup-container').innerHTML = `
            <div class="text-center py-10">
                <span class="material-symbols-outlined text-6xl text-[#ffb4a3] mb-4">
                    mail
                </span>

                <h2 class="text-3xl font-serif mb-4">
                    Check Your Inbox
                </h2>

                <p class="text-gray-400 mb-8">
                    We have sent a verification email to 
                    <b>${email}</b>.
                    Please verify your email address before signing in.
                </p>

                <a href="client-portal-sign-in.html"
                class="bg-[#ffb4a3] text-[#3d0600] px-8 py-4 font-bold uppercase tracking-widest">
                    Go to Login
                </a>
            </div>
        `;


    } catch (err) {

        console.error(err);

        errEl.innerText = err.message;
        errEl.classList.remove('hidden');

        btn.disabled = false;
        btn.innerText = "Create Account";
    }
});
</script>
</body>
</html>
