<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inquiry Specifications | EAMA Garments</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        :root {
            --primary: #FF6B4A;
            --bg: #0A0A0A;
            --surface: #121212;
            --outline: rgba(255, 255, 255, 0.1);
            --text-muted: #A1A1A1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: #e3e2e2;
            font-family: 'Inter', sans-serif;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1,
        h2,
        h3 {
            font-family: 'Playfair Display', serif;
            color: #fff;
            font-weight: 400;
        }

        header {
            border-bottom: 1px solid var(--outline);
            padding-bottom: 20px;
            margin-bottom: 40px;
        }

        /* Product Cards */

        .product-card {
            background: var(--surface);
            border: 1px solid var(--outline);
            padding: 25px;
            margin-bottom: 25px;
            display: grid;
            grid-template-columns: 150px 1fr;
            gap: 25px;
            border-radius: 4px;
        }

        .product-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border: 1px solid var(--outline);
            background: #0f0f0f;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }

        label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.1em;
        }

        select,
        input,
        textarea {
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--outline);
            color: #fff;
            padding: 10px 0;
            font-size: 15px;
            width: 100%;
            outline: none;
            transition: 0.3s;
            font-family: 'Inter', sans-serif;
        }

        select option {
            background: #1a1a1a;
            color: #fff;
        }

        select:focus,
        input:focus,
        textarea:focus {
            border-bottom-color: var(--primary);
        }

        textarea {
            resize: vertical;
        }

        .field-block {
            margin-top: 20px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.02);
            border-left: 2px solid var(--primary);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .is-hidden {
            display: none !important;
        }

        .btn-submit {
            background: var(--primary);
            color: #fff;
            padding: 20px;
            border: none;
            width: 100%;
            text-transform: uppercase;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.2em;
            margin-top: 40px;
            transition: 0.4s;
        }

        .btn-submit:hover:not(:disabled) {
            background: #fff;
            color: #000;
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #success-state {
            display: none;
            text-align: center;
            padding: 80px 20px;
        }

        .error-box {
            max-width: 520px;
            margin: 0 auto;
            line-height: 1.7;
        }

        .error-title {
            font-size: 14px;
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 10px;
        }

        .error-message {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 18px;
        }

        .retry-button {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 12px 20px;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.5px;
        }

        .retry-button:hover {
            background: #fff;
            color: #000;
        }

        .image-fallback {
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 11px;
            text-align: center;
        }

        @media (max-width: 768px) {

            body {
                padding: 25px 15px;
            }

            .product-card {
                grid-template-columns: 1fr;
            }

            .product-image {
                height: 300px;
                max-width: 100%;
            }

            .grid-2 {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: span 1 !important;
            }

            #success-state {
                padding: 60px 20px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================================================
         FORM CONTAINER
         ========================================================= -->

    <div class="container" id="form-container">

        <header>
            <span
                style="
                    color: var(--primary);
                    font-size: 11px;
                    letter-spacing: 3px;
                    text-transform: uppercase;
                "
            >
                EAMA Manufacturing
            </span>

            <h1
                style="
                    font-size: 2.5rem;
                    margin-top: 5px;
                "
            >
                Configure Inquiry
            </h1>
        </header>


        <!-- Loading -->

        <div
            id="loading-overlay"
            style="
                text-align: center;
                padding: 40px;
                color: var(--primary);
            "
        >
            Synchronizing with Sample Inventory...
        </div>


        <!-- =====================================================
             INQUIRY FORM
             ===================================================== -->

        <form
            id="eama-inquiry-form"
            class="is-hidden"
        >

            <div id="productList"></div>


            <!-- =================================================
                 CLIENT INFORMATION
                 ================================================= -->

            <section
                style="
                    margin-top: 50px;
                    border-top: 1px solid var(--outline);
                    padding-top: 40px;
                "
            >

                <h2
                    style="
                        margin-bottom: 25px;
                        font-size: 1.8rem;
                    "
                >
                    Client Information
                </h2>


                <div class="grid-2">

                    <div class="form-group">
                        <label for="biz_company">
                            Company Name
                        </label>

                        <input
                            type="text"
                            id="biz_company"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="biz_name">
                            Contact Person
                        </label>

                        <input
                            type="text"
                            id="biz_name"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="biz_email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="biz_email"
                            required
                            readonly
                        >
                    </div>


                    <div class="form-group">
                        <label for="biz_phone">
                            WhatsApp / Phone
                        </label>

                        <input
                            type="tel"
                            id="biz_phone"
                            required
                        >
                    </div>


                    <div
                        class="form-group"
                        style="grid-column: span 2;"
                    >
                        <label for="biz_country">
                            Target Country
                        </label>

                        <input
                            type="text"
                            id="biz_country"
                            required
                        >
                    </div>

                </div>

            </section>


            <!-- Submit -->

            <button
                type="submit"
                class="btn-submit"
                id="submitBtn"
            >
                Submit Formal Inquiry
            </button>

        </form>

    </div>


    <!-- =========================================================
         SUCCESS STATE
         ========================================================= -->

    <div
        id="success-state"
        class="container"
    >

        <h1
            style="
                color: var(--primary);
                font-size: 3rem;
            "
        >
            Inquiry Logged.
        </h1>

        <p style="margin-top: 15px;">
            Your request is now visible in your Client Dashboard
            and our production queue.
        </p>

        <button
            type="button"
            onclick="goToDashboard()"
            style="
                margin-top: 30px;
                background: var(--primary);
                color: #fff;
                padding: 15px 30px;
                border: none;
                cursor: pointer;
                text-transform: uppercase;
                font-size: 11px;
                font-weight: 700;
            "
        >
            View Dashboard
        </button>

    </div>


    <!-- =========================================================
         SUPABASE
         ========================================================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        /* =========================================================
           EAMA GARMENTS
           REQUEST QUOTE / INQUIRY PAGE
           ========================================================= */


        /* =========================================================
           SUPABASE CONFIGURATION
           ========================================================= */

        const SUPABASE_URL =
            "https://mxbzlscxsonbwiqjmnzx.supabase.co";

        /*
         * IMPORTANT:
         * Put your existing Supabase PUBLISHABLE KEY here.
         *
         * Do NOT use the service_role key.
         */

        const SUPABASE_KEY =
            "sb_publishable_H3k7_8EsXTns6v0YVOdGww_9xd6iBYE";


        const _supabase =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /* =========================================================
           STORAGE
           ========================================================= */

        const storageKey =
            "eamaRequestShortlist";


        /* =========================================================
           GLOBAL STATE
           ========================================================= */

        let dbSamples = [];

        let currentUser = null;


        /* =========================================================
           DOM ELEMENTS
           ========================================================= */

        const loadingOverlay =
            document.getElementById(
                "loading-overlay"
            );

        const inquiryForm =
            document.getElementById(
                "eama-inquiry-form"
            );

        const productList =
            document.getElementById(
                "productList"
            );

        const submitBtn =
            document.getElementById(
                "submitBtn"
            );

        const formContainer =
            document.getElementById(
                "form-container"
            );

        const successState =
            document.getElementById(
                "success-state"
            );


        /* =========================================================
           LOADING MESSAGE
           ========================================================= */

        function showLoading(message) {

            loadingOverlay.classList.remove(
                "is-hidden"
            );

            loadingOverlay.innerHTML = message;
        }


        /* =========================================================
           ERROR MESSAGE
           ========================================================= */

        function showError(message) {

            loadingOverlay.classList.remove(
                "is-hidden"
            );

            loadingOverlay.innerHTML = `

                <div class="error-box">

                    <div class="error-title">
                        Unable to load inquiry
                    </div>

                    <div class="error-message">
                        ${escapeHTML(message)}
                    </div>

                    <button
                        type="button"
                        class="retry-button"
                        onclick="window.location.reload()"
                    >
                        Try Again
                    </button>

                </div>

            `;

            inquiryForm.classList.add(
                "is-hidden"
            );
        }


        /* =========================================================
           HTML ESCAPE
           Prevents database values from being interpreted
           as HTML.
           ========================================================= */

        function escapeHTML(value) {

            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }


        /* =========================================================
           IMAGE ERROR
           ========================================================= */

        function handleImageError(image) {

            const fallback =
                document.createElement("div");

            fallback.className =
                "product-image image-fallback";

            fallback.innerText =
                "Sample image unavailable";

            image.replaceWith(fallback);
        }


        /* =========================================================
           INITIALIZE PAGE
           ========================================================= */

        async function initPage() {

            try {

                /* ---------------------------------------------
                   Step 1
                   Check Supabase client
                   --------------------------------------------- */

                if (
                    typeof supabase === "undefined"
                ) {

                    throw new Error(
                        "Supabase could not be loaded. Please refresh the page."
                    );
                }


                /* ---------------------------------------------
                   Step 2
                   Check logged-in user
                   --------------------------------------------- */

                showLoading(
                    "Checking your client session..."
                );


                const {
                    data,
                    error: authError
                } =
                    await _supabase.auth.getUser();


                /*
                 * If Supabase returns an authentication error,
                 * show the actual reason in the console.
                 */

                if (authError) {

                    console.error(
                        "Supabase authentication error:",
                        authError
                    );

                    /*
                     * A stale/expired session is not necessarily
                     * a broken application.
                     */

                    if (
                        authError.message &&
                        authError.message.toLowerCase().includes(
                            "jwt"
                        )
                    ) {

                        await _supabase.auth.signOut();

                        alert(
                            "Your login session has expired. Please sign in again."
                        );

                        window.location.href =
                            "client-portal-sign-in.html";

                        return;
                    }


                    throw new Error(
                        authError.message ||
                        "We could not verify your client session."
                    );
                }


                const user = data?.user || null;


                /* ---------------------------------------------
                   Step 3
                   User not logged in
                   --------------------------------------------- */

                if (!user) {

                    alert(
                        "Please log in to submit an inquiry."
                    );

                    window.location.href =
                        "client-portal-sign-in.html";

                    return;
                }


                /* ---------------------------------------------
                   Step 4
                   Store current user
                   --------------------------------------------- */

                currentUser = user;


                document.getElementById(
                    "biz_email"
                ).value =
                    user.email || "";


                /* ---------------------------------------------
                   Step 5
                   Load shortlist
                   --------------------------------------------- */

                showLoading(
                    "Synchronizing with Sample Inventory..."
                );


                let shortlist = [];


                try {

                    const saved =
                        localStorage.getItem(
                            storageKey
                        );


                    if (saved) {

                        shortlist =
                            JSON.parse(saved);

                    }

                } catch (storageError) {

                    console.error(
                        "Shortlist storage error:",
                        storageError
                    );

                    shortlist = [];
                }


                /* ---------------------------------------------
                   Make sure shortlist is an array
                   --------------------------------------------- */

                if (
                    !Array.isArray(shortlist)
                ) {

                    shortlist = [];
                }


                /* ---------------------------------------------
                   No samples
                   --------------------------------------------- */

                if (
                    shortlist.length === 0
                ) {

                    showError(
                        "No samples have been selected from the gallery. Please return to the Sample Catalog and add at least one garment to your request."
                    );

                    return;
                }


                /* ---------------------------------------------
                   Extract sample IDs
                   --------------------------------------------- */

                const ids =
                    shortlist
                        .map(
                            item =>
                                item?.id
                        )
                        .filter(
                            id =>
                                id !== null &&
                                id !== undefined &&
                                String(id).trim() !== ""
                        );


                if (
                    ids.length === 0
                ) {

                    localStorage.removeItem(
                        storageKey
                    );

                    showError(
                        "The selected samples could not be identified. Please return to the gallery and select the samples again."
                    );

                    return;
                }


                console.log(
                    "Loading sample IDs:",
                    ids
                );


                /* ---------------------------------------------
                   Step 6
                   Load samples
                   --------------------------------------------- */

                const {
                    data: samples,
                    error: sampleError
                } =
                    await _supabase
                        .from("samples")
                        .select("*")
                        .in(
                            "id",
                            ids
                        );


                if (sampleError) {

                    console.error(
                        "Sample inventory error:",
                        sampleError
                    );

                    throw new Error(
                        sampleError.message ||
                        "The sample inventory could not be loaded."
                    );
                }


                dbSamples =
                    samples || [];


                /* ---------------------------------------------
                   Remove samples that no longer exist
                   --------------------------------------------- */

                const currentIds =
                    new Set(
                        dbSamples.map(
                            sample =>
                                String(
                                    sample.id
                                )
                        )
                    );


                const validShortlist =
                    shortlist.filter(
                        item =>
                            currentIds.has(
                                String(
                                    item.id
                                )
                            )
                    );


                if (
                    validShortlist.length !==
                    shortlist.length
                ) {

                    localStorage.setItem(
                        storageKey,
                        JSON.stringify(
                            validShortlist
                        )
                    );
                }


                /* ---------------------------------------------
                   All samples deleted
                   --------------------------------------------- */

                if (
                    dbSamples.length === 0
                ) {

                    localStorage.removeItem(
                        storageKey
                    );

                    showError(
                        "The samples previously selected from the gallery are no longer available. Please return to the gallery and select current samples."
                    );

                    return;
                }


                /* ---------------------------------------------
                   Step 7
                   Render inquiry
                   --------------------------------------------- */

                renderForm();


                /* ---------------------------------------------
                   Step 8
                   Show form
                   --------------------------------------------- */

                loadingOverlay.classList.add(
                    "is-hidden"
                );

                inquiryForm.classList.remove(
                    "is-hidden"
                );


            } catch (error) {

                console.error(
                    "Request quote initialization error:",
                    error
                );


                showError(
                    error.message ||
                    "Something went wrong while loading the inquiry form."
                );
            }
        }


        /* =========================================================
           RENDER PRODUCT FORM
           ========================================================= */

        function renderForm() {

            productList.innerHTML = "";


            dbSamples.forEach(
                (sample, index) => {

                    /* -----------------------------------------
                       Fabrics
                       ----------------------------------------- */

                    const fabrics =
                        sample.fabric
                            ? String(
                                sample.fabric
                            )
                                .split(",")
                                .map(
                                    item =>
                                        item.trim()
                                )
                                .filter(Boolean)
                            : ["Standard"];


                    /* -----------------------------------------
                       Colors
                       ----------------------------------------- */

                    const colors =
                        sample.color
                            ? String(
                                sample.color
                            )
                                .split(",")
                                .map(
                                    item =>
                                        item.trim()
                                )
                                .filter(Boolean)
                            : ["As per Sample"];


                    /* -----------------------------------------
                       Sizes
                       ----------------------------------------- */

                    const sizes = [
                        "XS",
                        "S",
                        "M",
                        "L",
                        "XL",
                        "XXL"
                    ];


                    /* -----------------------------------------
                       Create card
                       ----------------------------------------- */

                    const card =
                        document.createElement(
                            "div"
                        );

                    card.className =
                        "product-card";


                    card.innerHTML = `

                        <img
                            src="${escapeHTML(
                                sample.image_url || ""
                            )}"
                            class="product-image"
                            alt="${escapeHTML(
                                sample.sample_name || "Sample"
                            )}"
                            loading="lazy"
                            onerror="handleImageError(this)"
                        >


                        <div>

                            <h3
                                style="
                                    margin-bottom:5px;
                                "
                            >
                                ${escapeHTML(
                                    sample.sample_name ||
                                    "Sample"
                                )}
                            </h3>


                            <p
                                style="
                                    font-size:12px;
                                    color:var(--text-muted);
                                    margin-bottom:15px;
                                "
                            >
                                Category:
                                ${escapeHTML(
                                    sample.category || "-"
                                )}
                            </p>


                            <!-- REQUEST TYPE -->

                            <div class="form-group">

                                <label>
                                    Request Type
                                </label>

                                <select
                                    class="field-type"
                                >

                                    <option value="sample">
                                        Request Sample
                                    </option>

                                    <option value="quote">
                                        Request Manufacturing Quote
                                    </option>

                                    <option
                                        value="both"
                                        selected
                                    >
                                        Request Sample & Quote
                                    </option>

                                </select>

                            </div>


                            <!-- SPECIFICATIONS -->

                            <div class="field-block">

                                <div class="grid-2">


                                    <!-- FABRIC -->

                                    <div class="form-group">

                                        <label>
                                            Available Fabrics
                                        </label>

                                        <select
                                            class="f-fabric"
                                        >

                                            ${fabrics
                                                .map(
                                                    fabric => `
                                                        <option
                                                            value="${escapeHTML(
                                                                fabric
                                                            )}"
                                                        >
                                                            ${escapeHTML(
                                                                fabric
                                                            )}
                                                        </option>
                                                    `
                                                )
                                                .join("")}

                                        </select>

                                    </div>


                                    <!-- COLOR -->

                                    <div class="form-group">

                                        <label>
                                            Available Colors
                                        </label>

                                        <select
                                            class="f-color"
                                        >

                                            ${colors
                                                .map(
                                                    color => `
                                                        <option
                                                            value="${escapeHTML(
                                                                color
                                                            )}"
                                                        >
                                                            ${escapeHTML(
                                                                color
                                                            )}
                                                        </option>
                                                    `
                                                )
                                                .join("")}

                                        </select>

                                    </div>


                                    <!-- SIZE -->

                                    <div class="form-group">

                                        <label>
                                            Size
                                        </label>

                                        <select
                                            class="f-size"
                                        >

                                            ${sizes
                                                .map(
                                                    size => `
                                                        <option
                                                            value="${size}"
                                                            ${
                                                                size === "M"
                                                                    ? "selected"
                                                                    : ""
                                                            }
                                                        >
                                                            ${size}
                                                        </option>
                                                    `
                                                )
                                                .join("")}

                                        </select>

                                    </div>


                                    <!-- QUANTITY -->

                                    <div class="form-group">

                                        <label>
                                            Target Quantity
                                        </label>

                                        <input
                                            type="number"
                                            class="f-qty"
                                            value="100"
                                            min="1"
                                            required
                                        >

                                    </div>


                                    <!-- CUSTOMIZATION -->

                                    <div
                                        class="form-group f-custom-wrap full-width"
                                        style="
                                            grid-column:span 2;
                                        "
                                    >

                                        <label>
                                            Customization / Branding
                                        </label>

                                        <input
                                            type="text"
                                            class="f-custom"
                                            placeholder="e.g. Branded woven labels and chest print"
                                        >

                                    </div>

                                </div>


                                <!-- NOTES -->

                                <div
                                    class="form-group"
                                    style="
                                        margin-top:10px;
                                    "
                                >

                                    <label>
                                        Additional Notes
                                    </label>

                                    <textarea
                                        class="f-notes"
                                        rows="3"
                                        placeholder="Any specific requirements..."
                                    ></textarea>

                                </div>

                            </div>

                        </div>
                    `;


                    productList.appendChild(
                        card
                    );


                    /* -----------------------------------------
                       Request type listener
                       ----------------------------------------- */

                    const typeSelect =
                        card.querySelector(
                            ".field-type"
                        );


                    typeSelect.addEventListener(
                        "change",
                        function () {

                            const customWrap =
                                card.querySelector(
                                    ".f-custom-wrap"
                                );


                            customWrap.classList.toggle(
                                "is-hidden",
                                this.value === "sample"
                            );

                        }
                    );

                }
            );
        }


        /* =========================================================
           FORM SUBMISSION
           ========================================================= */

        inquiryForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                if (!currentUser) {

                    alert(
                        "Your login session is no longer available. Please sign in again."
                    );

                    window.location.href =
                        "client-portal-sign-in.html";

                    return;
                }


                submitBtn.disabled = true;

                submitBtn.innerText =
                    "Processing Inquiry...";


                /* ---------------------------------------------
                   Client information
                   --------------------------------------------- */

                const biz = {

                    client_id:
                        currentUser.id,

                    company_name:
                        document
                            .getElementById(
                                "biz_company"
                            )
                            .value
                            .trim(),

                    contact_person:
                        document
                            .getElementById(
                                "biz_name"
                            )
                            .value
                            .trim(),

                    email:
                        document
                            .getElementById(
                                "biz_email"
                            )
                            .value
                            .trim(),

                    phone:
                        document
                            .getElementById(
                                "biz_phone"
                            )
                            .value
                            .trim(),

                    country:
                        document
                            .getElementById(
                                "biz_country"
                            )
                            .value
                            .trim()
                };


                try {

                    let emailLog = "";


                    const cards =
                        document.querySelectorAll(
                            ".product-card"
                        );


                    /* -----------------------------------------
                       Save every selected product
                       ----------------------------------------- */

                    for (
                        let i = 0;
                        i < cards.length;
                        i++
                    ) {

                        const card =
                            cards[i];

                        const dbSample =
                            dbSamples[i];


                        if (!dbSample) {
                            continue;
                        }


                        const type =
                            card
                                .querySelector(
                                    ".field-type"
                                )
                                .value;


                        const quantity =
                            parseInt(
                                card
                                    .querySelector(
                                        ".f-qty"
                                    )
                                    .value,
                                10
                            );


                        const spec = {

                            fabric:
                                card
                                    .querySelector(
                                        ".f-fabric"
                                    )
                                    .value,

                            color:
                                card
                                    .querySelector(
                                        ".f-color"
                                    )
                                    .value,

                            size:
                                card
                                    .querySelector(
                                        ".f-size"
                                    )
                                    .value,

                            qty:
                                Number.isFinite(
                                    quantity
                                ) &&
                                quantity > 0
                                    ? quantity
                                    : 1,

                            custom:
                                card
                                    .querySelector(
                                        ".f-custom"
                                    )
                                    .value
                                    .trim(),

                            notes:
                                card
                                    .querySelector(
                                        ".f-notes"
                                    )
                                    .value
                                    .trim()
                        };


                        /* -------------------------------------
                           Insert into manufacturing_requests
                           ------------------------------------- */

                        const {
                            error
                        } =
                            await _supabase
                                .from(
                                    "manufacturing_requests"
                                )
                                .insert([

                                    {

                                        ...biz,

                                        garment_category:
                                            dbSample.category,

                                        product_type:
                                            dbSample.sample_name,

                                        request_type:
                                            type,

                                        fabric_preference:
                                            spec.fabric,

                                        sample_color:
                                            spec.color,

                                        sample_size:
                                            spec.size,

                                        target_quantity:
                                            spec.qty,

                                        customization_requirements:
                                            spec.custom,

                                        additional_notes:
                                            spec.notes,

                                        status:
                                            "New",

                                        priority:
                                            "Medium"
                                    }

                                ]);


                        if (error) {

                            console.error(
                                "Manufacturing request error:",
                                error
                            );

                            throw new Error(
                                error.message ||
                                "Your inquiry could not be saved."
                            );
                        }


                        emailLog +=
                            `${dbSample.sample_name} (${type}): ${spec.qty}pcs in ${spec.fabric}, ${spec.color}, size ${spec.size}.\n`;
                    }


                    /* -----------------------------------------
                       Send notification email
                       ----------------------------------------- */

                    try {

                        const {
                            error: funcError
                        } =
                            await _supabase.functions.invoke(
                                "send-inquiry-email",
                                {

                                    body: {

                                        customer_name:
                                            biz.contact_person,

                                        company_name:
                                            biz.company_name,

                                        customer_email:
                                            biz.email,

                                        admin_email:
                                            "admin@eamagarments.com",

                                        message:
                                            `New unified request received for:\n${emailLog}`
                                    }
                                }
                            );


                        if (funcError) {

                            console.error(
                                "Email notification error:",
                                funcError
                            );

                            /*
                             * The database request has already
                             * been successfully saved.
                             *
                             * Therefore we do NOT fail the inquiry
                             * just because email failed.
                             */

                            console.warn(
                                "Inquiry saved successfully, but email notification failed."
                            );
                        }

                    } catch (emailError) {

                        console.error(
                            "Email function exception:",
                            emailError
                        );

                        /*
                         * Continue because the inquiry itself
                         * was already saved.
                         */
                    }


                    /* -----------------------------------------
                       Success
                       ----------------------------------------- */

                    formContainer.style.display =
                        "none";

                    successState.style.display =
                        "block";

                    localStorage.removeItem(
                        storageKey
                    );


                } catch (error) {

                    console.error(
                        "Inquiry submission error:",
                        error
                    );


                    alert(
                        "Error: " +
                        (
                            error.message ||
                            "Unable to submit inquiry."
                        )
                    );


                    submitBtn.disabled = false;

                    submitBtn.innerText =
                        "Submit Formal Inquiry";
                }

            }
        );


        /* =========================================================
           DASHBOARD
           ========================================================= */

        function goToDashboard() {

            /*
             * Change this only if your dashboard is located
             * somewhere else.
             */

            window.location.href =
                "dashboard/app.html";
        }


        /* =========================================================
           START APPLICATION
           ========================================================= */

        initPage();

    </script>

</body>
</html>
