<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inquiry Specifications | EAMA Garments</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;600;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary: #FF6B4A;
            --bg: #0A0A0A;
            --surface: #121212;
            --outline: rgba(255, 255, 255, 0.1);
            --text-muted: #A1A1A1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: #e3e2e2;
            font-family: 'Inter', sans-serif;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1,
        h2,
        h3 {
            font-family: 'Playfair Display', serif;
            color: #fff;
            font-weight: 400;
        }

        header {
            border-bottom: 1px solid var(--outline);
            padding-bottom: 20px;
            margin-bottom: 40px;
        }

        .account-status {
            margin-top: 15px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .account-status strong {
            color: #fff;
        }

        .product-card {
            background: var(--surface);
            border: 1px solid var(--outline);
            padding: 25px;
            margin-bottom: 25px;
            display: grid;
            grid-template-columns: 150px 1fr;
            gap: 25px;
            border-radius: 4px;
        }

        .product-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border: 1px solid var(--outline);
            background: #0d0d0d;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }

        label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.1em;
        }

        select,
        input,
        textarea {
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--outline);
            color: #fff;
            padding: 10px 0;
            font-size: 15px;
            width: 100%;
            outline: none;
            transition: 0.3s;
            font-family: 'Inter', sans-serif;
        }

        select option {
            background: #1a1a1a;
            color: #fff;
        }

        select:focus,
        input:focus,
        textarea:focus {
            border-bottom-color: var(--primary);
        }

        textarea {
            resize: vertical;
            min-height: 60px;
        }

        input::placeholder,
        textarea::placeholder {
            color: #666;
        }

        .field-block {
            margin-top: 20px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.02);
            border-left: 2px solid var(--primary);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .is-hidden {
            display: none !important;
        }

        #loading-overlay {
            text-align: center;
            padding: 40px;
            color: var(--primary);
        }

        .btn-submit {
            background: var(--primary);
            color: #fff;
            padding: 20px;
            border: none;
            width: 100%;
            text-transform: uppercase;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.2em;
            margin-top: 40px;
            transition: 0.4s;
        }

        .btn-submit:hover {
            background: #fff;
            color: #000;
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #success-state {
            display: none;
            text-align: center;
            padding: 80px 20px;
        }

        #success-state p {
            margin-top: 15px;
            color: var(--text-muted);
            line-height: 1.7;
        }

        .dashboard-btn {
            margin-top: 30px;
            background: var(--primary);
            color: #fff;
            padding: 15px 30px;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 11px;
            font-weight: 700;
        }

        .error-title {
            font-size: 14px;
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 10px;
        }

        .error-message {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 18px;
        }

        .retry-btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 12px 20px;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.5px;
        }

        @media (max-width: 768px) {

            body {
                padding: 25px 15px;
            }

            .product-card {
                grid-template-columns: 1fr;
                gap: 20px;
                padding: 18px;
            }

            .product-image {
                width: 100%;
                height: 280px;
            }

            .grid-2 {
                grid-template-columns: 1fr;
                gap: 5px;
            }

            .target-country {
                grid-column: span 1 !important;
            }

            h1 {
                font-size: 2rem !important;
            }

            #success-state h1 {
                font-size: 2.3rem !important;
            }
        }
    </style>
</head>

<body>

    <div class="container" id="form-container">

        <header>

            <span style="
            color: var(--primary);
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
        ">
                EAMA Manufacturing
            </span>

            <h1 style="font-size: 2.5rem; margin-top: 5px;">
                Configure Inquiry
            </h1>

            <div id="account-status" class="account-status"></div>

        </header>

        <div id="loading-overlay">
            Synchronizing with Sample Inventory...
        </div>

        <form id="eama-inquiry-form" class="is-hidden">

            <div id="productList"></div>

            <section style="
            margin-top: 50px;
            border-top: 1px solid var(--outline);
            padding-top: 40px;
        ">

                <h2 style="
                margin-bottom: 25px;
                font-size: 1.8rem;
            ">
                    Client Information
                </h2>

                <div class="grid-2">

                    <div class="form-group">
                        <label for="biz_company">
                            Company Name
                        </label>

                        <input type="text" id="biz_company" autocomplete="organization" required>
                    </div>

                    <div class="form-group">
                        <label for="biz_name">
                            Contact Person
                        </label>

                        <input type="text" id="biz_name" autocomplete="name" required>
                    </div>

                    <div class="form-group">
                        <label for="biz_email">
                            Email Address
                        </label>

                        <input type="email" id="biz_email" autocomplete="email" required>
                    </div>

                    <div class="form-group">
                        <label for="biz_phone">
                            WhatsApp / Phone
                        </label>

                        <input type="tel" id="biz_phone" autocomplete="tel" required>
                    </div>

                    <div class="form-group target-country" style="grid-column: span 2;">

                        <label for="biz_country">
                            Target Country
                        </label>

                        <input type="text" id="biz_country" autocomplete="country-name" required>

                    </div>

                </div>

            </section>

            <button type="submit" class="btn-submit" id="submitBtn">
                Submit Formal Inquiry
            </button>

        </form>

    </div>

    <div id="success-state" class="container">

        <h1 style="
        color: var(--primary);
        font-size: 3rem;
    ">
            Inquiry Logged.
        </h1>

        <p>
            Your request has been received successfully.
            Our team will review your requirements and get back to you.
        </p>

        <button class="dashboard-btn" id="dashboardBtn">
            View Dashboard
        </button>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        const SUPABASE_URL =
            "https://mxbzlscxsonbwiqjmnzx.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_H3k7_8EsXTns6v0YVOdGww_9xd6iBYE";


        const _supabase =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        const storageKey =
            "eamaRequestShortlist";


        let dbSamples = [];

        let currentUser = null;


        const loadingOverlay =
            document.getElementById(
                "loading-overlay"
            );

        const inquiryForm =
            document.getElementById(
                "eama-inquiry-form"
            );

        const productList =
            document.getElementById(
                "productList"
            );

        const submitBtn =
            document.getElementById(
                "submitBtn"
            );

        const formContainer =
            document.getElementById(
                "form-container"
            );

        const successState =
            document.getElementById(
                "success-state"
            );

        const accountStatus =
            document.getElementById(
                "account-status"
            );

        const dashboardBtn =
            document.getElementById(
                "dashboardBtn"
            );


        // ============================================================
        // LOADING
        // ============================================================

        function showLoading(message) {

            loadingOverlay.classList.remove(
                "is-hidden"
            );

            loadingOverlay.innerText =
                message;
        }


        // ============================================================
        // ERROR
        // ============================================================

        function showError(message) {

            loadingOverlay.classList.remove(
                "is-hidden"
            );

            loadingOverlay.innerHTML = `

        <div
            style="
                max-width:520px;
                margin:0 auto;
                line-height:1.7;
            "
        >

            <div class="error-title">
                Unable to load inquiry
            </div>

            <div class="error-message">
                ${escapeHtml(message)}
            </div>

            <button
                type="button"
                class="retry-btn"
                onclick="window.location.reload()"
            >
                Try Again
            </button>

        </div>

    `;

            inquiryForm.classList.add(
                "is-hidden"
            );
        }


        // ============================================================
        // INITIALIZE PAGE
        // ============================================================

        async function initPage() {

            try {

                showLoading(
                    "Loading inquiry..."
                );


                // ------------------------------------------------------
                // CHECK AUTH SESSION
                // ------------------------------------------------------

                let user = null;

                try {

                    const {
                        data,
                        error
                    } =
                        await _supabase.auth.getUser();


                    if (!error && data) {

                        user =
                            data.user || null;

                    }

                } catch (authError) {

                    console.warn(
                        "No active Supabase session:",
                        authError
                    );

                    user = null;

                }


                currentUser =
                    user;


                // ------------------------------------------------------
                // LOGGED-IN USER
                // ------------------------------------------------------

                if (currentUser) {

                    accountStatus.innerHTML = `
                Logged in as
                <strong>
                    ${escapeHtml(
                        currentUser.email || ""
                    )}
                </strong>
            `;


                    const emailInput =
                        document.getElementById(
                            "biz_email"
                        );


                    emailInput.value =
                        currentUser.email || "";

                }


                // ------------------------------------------------------
                // GUEST
                // ------------------------------------------------------

                else {

                    accountStatus.innerHTML = `
                You can submit an inquiry without creating an account.
                Just provide your contact details below.
            `;

                }


                // ------------------------------------------------------
                // LOAD SHORTLIST
                // ------------------------------------------------------

                showLoading(
                    "Synchronizing with Sample Inventory..."
                );


                let shortlist = [];


                try {

                    const saved =
                        localStorage.getItem(
                            storageKey
                        );


                    shortlist =
                        saved
                            ? JSON.parse(saved)
                            : [];


                } catch (storageError) {

                    console.error(
                        "Shortlist storage error:",
                        storageError
                    );

                    shortlist = [];

                }


                if (!Array.isArray(shortlist)) {

                    shortlist = [];

                }


                // ------------------------------------------------------
                // NO PRODUCTS
                // ------------------------------------------------------

                if (shortlist.length === 0) {

                    showError(
                        "No samples have been selected from the gallery. Please return to the Sample Catalog and add at least one garment to your request."
                    );

                    return;
                }


                // ------------------------------------------------------
                // EXTRACT IDS
                // ------------------------------------------------------

                const ids =
                    shortlist

                        .map(
                            item =>
                                item &&
                                item.id
                        )

                        .filter(
                            id =>
                                id !== null &&
                                id !== undefined &&
                                String(id).trim() !== ""
                        );


                if (ids.length === 0) {

                    localStorage.removeItem(
                        storageKey
                    );


                    showError(
                        "The selected samples could not be identified. Please return to the gallery and select the samples again."
                    );

                    return;
                }


                // ------------------------------------------------------
                // LOAD SAMPLES
                // ------------------------------------------------------

                const {
                    data,
                    error
                } =
                    await _supabase

                        .from("samples")

                        .select("*")

                        .in(
                            "id",
                            ids
                        );


                if (error) {

                    console.error(
                        "Sample inventory error:",
                        error
                    );


                    throw new Error(
                        "The sample inventory could not be loaded. Please try again."
                    );
                }


                dbSamples =
                    data || [];


                // ------------------------------------------------------
                // REMOVE DELETED PRODUCTS
                // ------------------------------------------------------

                const currentIds =
                    new Set(
                        dbSamples.map(
                            sample =>
                                String(
                                    sample.id
                                )
                        )
                    );


                const validShortlist =
                    shortlist.filter(
                        item =>
                            currentIds.has(
                                String(item.id)
                            )
                    );


                if (
                    validShortlist.length !==
                    shortlist.length
                ) {

                    localStorage.setItem(
                        storageKey,
                        JSON.stringify(
                            validShortlist
                        )
                    );

                }


                // ------------------------------------------------------
                // NO VALID PRODUCTS
                // ------------------------------------------------------

                if (dbSamples.length === 0) {

                    localStorage.removeItem(
                        storageKey
                    );


                    showError(
                        "The samples previously selected from the gallery are no longer available. Please return to the gallery and select current samples."
                    );

                    return;
                }


                // ------------------------------------------------------
                // RENDER
                // ------------------------------------------------------

                renderForm();


                loadingOverlay.classList.add(
                    "is-hidden"
                );


                inquiryForm.classList.remove(
                    "is-hidden"
                );


            } catch (error) {

                console.error(
                    "Request quote initialization error:",
                    error
                );


                showError(
                    error.message ||
                    "Something went wrong while loading the inquiry form."
                );

            }

        }


        // ============================================================
        // RENDER PRODUCTS
        // ============================================================

        function renderForm() {

            productList.innerHTML = "";


            dbSamples.forEach(
                (sample) => {

                    const fabrics =
                        sample.fabric

                            ? sample.fabric
                                .split(",")
                                .map(
                                    s =>
                                        s.trim()
                                )
                                .filter(Boolean)

                            : ["Standard"];


                    const colors =
                        sample.color

                            ? sample.color
                                .split(",")
                                .map(
                                    s =>
                                        s.trim()
                                )
                                .filter(Boolean)

                            : ["As per Sample"];


                    const sizes = [
                        "XS",
                        "S",
                        "M",
                        "L",
                        "XL",
                        "XXL"
                    ];


                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "product-card";


                    card.innerHTML = `

                <img
                    src="${escapeAttribute(
                        sample.image_url || ""
                    )}"
                    class="product-image"
                    alt="${escapeAttribute(
                        sample.sample_name || "Sample"
                    )}"
                    loading="lazy"
                >


                <div>

                    <h3
                        style="
                            margin-bottom:5px;
                        "
                    >
                        ${escapeHtml(
                        sample.sample_name ||
                        "Sample"
                    )}
                    </h3>


                    <p
                        style="
                            font-size:12px;
                            color:var(--text-muted);
                            margin-bottom:15px;
                        "
                    >
                        Category:
                        ${escapeHtml(
                        sample.category || "-"
                    )}
                    </p>


                    <!-- REQUEST TYPE -->

                    <div class="form-group">

                        <label>
                            Request Type
                        </label>

                        <select
                            class="field-type"
                        >

                            <option value="sample">
                                Request Sample
                            </option>

                            <option value="quote">
                                Request Manufacturing Quote
                            </option>

                            <option
                                value="both"
                                selected
                            >
                                Request Sample & Quote
                            </option>

                        </select>

                    </div>


                    <!-- SPECIFICATIONS -->

                    <div class="field-block">

                        <div class="grid-2">


                            <!-- FABRIC -->

                            <div class="form-group">

                                <label>
                                    Available Fabrics
                                </label>

                                <select
                                    class="f-fabric"
                                >

                                    ${fabrics.map(
                        fabric => `
                                            <option
                                                value="${escapeAttribute(
                            fabric
                        )}"
                                            >
                                                ${escapeHtml(
                            fabric
                        )}
                                            </option>
                                        `
                    ).join("")}

                                </select>

                            </div>


                            <!-- COLOR -->

                            <div class="form-group">

                                <label>
                                    Available Colors
                                </label>

                                <select
                                    class="f-color"
                                >

                                    ${colors.map(
                        color => `
                                            <option
                                                value="${escapeAttribute(
                            color
                        )}"
                                            >
                                                ${escapeHtml(
                            color
                        )}
                                            </option>
                                        `
                    ).join("")}

                                </select>

                            </div>


                            <!-- SIZE -->

                            <div class="form-group">

                                <label>
                                    Size
                                </label>

                                <select
                                    class="f-size"
                                >

                                    ${sizes.map(
                        size => `
                                            <option
                                                value="${size}"
                                                ${size === "M"
                                ? "selected"
                                : ""
                            }
                                            >
                                                ${size}
                                            </option>
                                        `
                    ).join("")}

                                </select>

                            </div>


                            <!-- QUANTITY -->

                            <div class="form-group">

                                <label>
                                    Target Quantity
                                </label>

                                <input
                                    type="number"
                                    class="f-qty"
                                    value="100"
                                    min="1"
                                    required
                                >

                            </div>


                            <!-- CUSTOMIZATION -->

                            <div
                                class="form-group f-custom-wrap"
                                style="
                                    grid-column:span 2;
                                "
                            >

                                <label>
                                    Customization / Branding
                                </label>

                                <input
                                    type="text"
                                    class="f-custom"
                                    placeholder="e.g. Branded woven labels and chest print"
                                >

                            </div>


                        </div>


                        <!-- NOTES -->

                        <div
                            class="form-group"
                            style="
                                margin-top:10px;
                            "
                        >

                            <label>
                                Additional Notes
                            </label>

                            <textarea
                                class="f-notes"
                                rows="3"
                                placeholder="Any specific requirements..."
                            ></textarea>

                        </div>

                    </div>

                </div>

            `;


                    productList.appendChild(
                        card
                    );


                    // --------------------------------------------------
                    // REQUEST TYPE CHANGE
                    // --------------------------------------------------

                    const typeSelect =
                        card.querySelector(
                            ".field-type"
                        );


                    typeSelect.addEventListener(
                        "change",
                        function () {

                            const customWrap =
                                card.querySelector(
                                    ".f-custom-wrap"
                                );


                            customWrap.classList.toggle(
                                "is-hidden",
                                this.value === "sample"
                            );

                        }
                    );

                }
            );

        }


        // ============================================================
        // SUBMIT
        // ============================================================

        inquiryForm.addEventListener(
            "submit",
            async function (e) {

                e.preventDefault();


                const companyInput =
                    document.getElementById(
                        "biz_company"
                    );


                const nameInput =
                    document.getElementById(
                        "biz_name"
                    );


                const emailInput =
                    document.getElementById(
                        "biz_email"
                    );


                const phoneInput =
                    document.getElementById(
                        "biz_phone"
                    );


                const countryInput =
                    document.getElementById(
                        "biz_country"
                    );


                const emailValue =
                    emailInput.value.trim();


                // ------------------------------------------------------
                // VALIDATION
                // ------------------------------------------------------

                if (!companyInput.value.trim()) {

                    alert(
                        "Please enter your company name."
                    );

                    return;
                }


                if (!nameInput.value.trim()) {

                    alert(
                        "Please enter the contact person's name."
                    );

                    return;
                }


                if (!emailValue) {

                    alert(
                        "Please enter your email address."
                    );

                    return;
                }


                if (!phoneInput.value.trim()) {

                    alert(
                        "Please enter your WhatsApp / phone number."
                    );

                    return;
                }


                if (!countryInput.value.trim()) {

                    alert(
                        "Please enter your target country."
                    );

                    return;
                }


                submitBtn.disabled =
                    true;


                submitBtn.innerText =
                    "Processing Inquiry...";


                const biz = {

                    company_name:
                        companyInput.value.trim(),

                    contact_person:
                        nameInput.value.trim(),

                    email:
                        emailValue,

                    phone:
                        phoneInput.value.trim(),

                    country:
                        countryInput.value.trim()

                };


                try {

                    const cards =
                        document.querySelectorAll(
                            ".product-card"
                        );


                    let firstInsertedId =
                        null;


                    // --------------------------------------------------
                    // SAVE EACH PRODUCT REQUEST
                    // --------------------------------------------------

                    for (
                        let i = 0;
                        i < cards.length;
                        i++
                    ) {

                        const card =
                            cards[i];


                        const dbSample =
                            dbSamples[i];


                        if (!dbSample) {
                            continue;
                        }


                        const requestType =
                            card
                                .querySelector(
                                    ".field-type"
                                )
                                .value;


                        const fabric =
                            card
                                .querySelector(
                                    ".f-fabric"
                                )
                                .value;


                        const color =
                            card
                                .querySelector(
                                    ".f-color"
                                )
                                .value;


                        const size =
                            card
                                .querySelector(
                                    ".f-size"
                                )
                                .value;


                        const quantity =
                            parseInt(
                                card
                                    .querySelector(
                                        ".f-qty"
                                    )
                                    .value,
                                10
                            ) || 1;


                        const customization =
                            card
                                .querySelector(
                                    ".f-custom"
                                )
                                .value
                                .trim();


                        const notes =
                            card
                                .querySelector(
                                    ".f-notes"
                                )
                                .value
                                .trim();


                        // ------------------------------------------------
                        // INSERT
                        // ------------------------------------------------

                        const requestId = crypto.randomUUID();

                        const { error: insertError } =
                            await _supabase
                                .from("manufacturing_requests")
                                .insert({

                                    id:
                                        requestId,

                                    company_name:
                                        biz.company_name,

                                    contact_person:
                                        biz.contact_person,

                                    email:
                                        biz.email,

                                    phone:
                                        biz.phone,

                                    country:
                                        biz.country,

                                    garment_category:
                                        dbSample.category ||
                                        null,

                                    product_type:
                                        dbSample.sample_name ||
                                        null,

                                    request_type:
                                        requestType,

                                    fabric_preference:
                                        fabric,

                                    sample_color:
                                        color,

                                    sample_size:
                                        size,

                                    target_quantity:
                                        quantity,

                                    customization_requirements:
                                        customization ||
                                        null,

                                    additional_notes:
                                        notes ||
                                        null,

                                    status:
                                        "New",

                                    priority:
                                        "Medium"

                                });




                        if (
                            insertError ||
                            !insertedRequest
                        ) {

                            console.error(
                                "Manufacturing request DB error:",
                                insertError
                            );


                            throw new Error(
                                insertError?.message ||
                                "Unable to save your request."
                            );
                        }


                        if (!firstInsertedId) {

                            firstInsertedId =
                                insertedRequest.id;

                        }

                    }


                    // --------------------------------------------------
                    // SEND BREVO EMAIL
                    // --------------------------------------------------

                    if (firstInsertedId) {

                        const {
                            data: funcData,
                            error: funcError
                        } =
                            await _supabase.functions.invoke(
                                "send-auth-email",
                                {
                                    body: {

                                        type:
                                            "manufacturing_request",

                                        email:
                                            biz.email,

                                        request_id:
                                            firstInsertedId,

                                        company_name:
                                            biz.company_name,

                                        contact_person:
                                            biz.contact_person

                                    }
                                }
                            );


                        if (funcError) {

                            console.error(
                                "Email function error:",
                                funcError
                            );

                            // IMPORTANT:
                            // The database request was already saved.
                            // We don't delete it just because email failed.

                            console.warn(
                                "Request was saved successfully, but confirmation email failed."
                            );

                        } else {

                            console.log(
                                "Email function success:",
                                funcData
                            );

                        }

                    }


                    // --------------------------------------------------
                    // SUCCESS
                    // --------------------------------------------------

                    formContainer.style.display =
                        "none";


                    successState.style.display =
                        "block";


                    localStorage.removeItem(
                        storageKey
                    );


                } catch (error) {

                    console.error(
                        "Inquiry submission error:",
                        error
                    );


                    alert(
                        "Error: " +
                        (
                            error.message ||
                            "Unable to submit inquiry."
                        )
                    );


                    submitBtn.disabled =
                        false;


                    submitBtn.innerText =
                        "Submit Formal Inquiry";

                }

            }
        );


        // ============================================================
        // DASHBOARD BUTTON
        // ============================================================

        dashboardBtn.addEventListener(
            "click",
            function () {

                if (currentUser) {

                    window.location.href =
                        "client-dashboard.html";

                } else {

                    window.location.href =
                        "client-portal-sign-in.html";

                }

            }
        );


        // ============================================================
        // SECURITY HELPERS
        // ============================================================

        function escapeHtml(value) {

            return String(value)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        function escapeAttribute(value) {

            return escapeHtml(value);

        }


        // ============================================================
        // START
        // ============================================================

        initPage();

    </script>

</body>

</html>
