<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Create New Password | EAMA Garments</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1" rel="stylesheet"/>
    <style>
        body { background-color: #0A0A0A; color: #e3e2e2; }
        .met { color: #ffb4a3; font-weight: 600; }
        .met span { font-variation-settings: 'FILL' 1; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6">
    <div class="max-w-xl w-full">
        <div class="text-center mb-10">
            <span class="text-[#ffb4a3] font-serif text-2xl uppercase tracking-widest">EAMA Garments</span>
        </div>

        <div class="bg-[#121212] border border-white/10 p-12 shadow-2xl relative">
            <div class="absolute top-0 left-0 w-1 h-full bg-[#ffb4a3]"></div>
            <h2 class="text-3xl font-serif text-center mb-8">Set New Password</h2>
            
            <div id="statusMessage" class="hidden mb-6 p-4 rounded text-xs text-center"></div>

            <form id="resetForm" class="space-y-8" onsubmit="handleFormSubmit(event)">
                <div class="space-y-4">
                    <input class="w-full bg-transparent border-b border-white/20 p-3 text-lg focus:border-[#ffb4a3] outline-none" id="new_password" type="password" placeholder="New Password" onkeyup="validateRequirements(this.value)" required>
                    <input class="w-full bg-transparent border-b border-white/20 p-3 text-lg focus:border-[#ffb4a3] outline-none" id="confirm_password" type="password" placeholder="Confirm Password" required>
                </div>

                <div class="bg-black/40 p-6 space-y-3">
                    <p class="text-[10px] uppercase text-gray-500 tracking-widest mb-2">Requirements</p>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-2 text-[11px] text-gray-400">
                        <div id="req-length" class="flex items-center gap-2"><span class="material-symbols-outlined text-sm">circle</span> 8+ Characters</div>
                        <div id="req-upper" class="flex items-center gap-2"><span class="material-symbols-outlined text-sm">circle</span> Uppercase Letter</div>
                        <div id="req-number" class="flex items-center gap-2"><span class="material-symbols-outlined text-sm">circle</span> One Number</div>
                    </div>
                </div>

                <button class="w-full bg-[#ffb4a3] text-[#3d0600] font-bold py-5 uppercase tracking-widest hover:bg-white transition-all">Update Password</button>
            </form>
        </div>
    </div>
  
    <script>
        function validateRequirements(v) {
            document.getElementById('req-length').className = v.length >= 8 ? 'met flex items-center gap-2' : 'flex items-center gap-2';
            document.getElementById('req-upper').className = /[A-Z]/.test(v) ? 'met flex items-center gap-2' : 'flex items-center gap-2';
            document.getElementById('req-number').className = /[0-9]/.test(v) ? 'met flex items-center gap-2' : 'flex items-center gap-2';
        }

        const statusMessage = document.getElementById('statusMessage');
        const submitButton = document.querySelector('#resetForm button');

        let recoveryReady = false;

        if (submitButton) {
            submitButton.disabled = true;
        }

        function showStatus(message, options = {}) {
            const { error = false, success = false } = options;
            statusMessage.classList.remove('hidden');
            statusMessage.classList.toggle('bg-red-900/20', error);
            statusMessage.classList.toggle('border-red-500/50', error);
            statusMessage.classList.toggle('text-red-200', error);
            statusMessage.classList.toggle('bg-green-900/20', success);
            statusMessage.classList.toggle('border-green-500/50', success);
            statusMessage.classList.toggle('text-green-200', success);
            statusMessage.innerText = message;
        }

        function disableSubmit(message) {
            if (submitButton) {
                submitButton.disabled = true;
            }
            showStatus(message, { error: true });
        }

        async function initializeRecovery() {
            const { data, error } = await eamaSupabase.auth.exchangeCodeForSession(window.location.href);

            if (error) {
                console.error("Recovery session error:", error.message);
                disableSubmit("Unable to establish recovery session. Please request a new password reset link.");
                return;
            }

            if (!data?.session) {
                console.error("Recovery session exchange succeeded but no session was returned.");
                disableSubmit("Unable to establish recovery session. Please request a new password reset link.");
                return;
            }

            recoveryReady = true;
            if (submitButton) {
                submitButton.disabled = false;
            }
            showStatus("Recovery session established. Enter your new password below.", { success: true });
            console.log("Recovery session created", data.session);
        }

        initializeRecovery();

        eamaSupabase.auth.onAuthStateChange((event, session) => {
            if (event === 'PASSWORD_RECOVERY') {
                recoveryReady = true;
                if (submitButton) {
                    submitButton.disabled = false;
                }
                showStatus("Recovery session ready. Enter your new password below.", { success: true });
                console.log("Recovery session ready", event, session);
            }
        });

        async function handleFormSubmit(e) {
            e.preventDefault();
            const pass = document.getElementById('new_password').value;
            const confirm = document.getElementById('confirm_password').value;

            if (!recoveryReady) {
                disableSubmit("Recovery session is not ready. Please open the password reset link again.");
                return;
            }

            if (pass !== confirm) {
                showStatus("Passwords do not match. Please confirm your new password.", { error: true });
                return;
            }

            const { error } = await eamaSupabase.auth.updateUser({ password: pass });
            if (error) {
                showStatus(error.message, { error: true });
            } else {
                alert("Password Updated Successfully!");
                window.location.href = "client-portal-sign-in.html";
            }
        }
    </script>
</body>
</html>
