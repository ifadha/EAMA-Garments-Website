<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Reset Password | EAMA Garments</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase-client.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1" rel="stylesheet"/>
    <style> body { background-color: #0A0A0A; color: #e3e2e2; } </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center relative">
    <header class="absolute top-12 text-center">
        <h1 class="text-[#ffb4a3] font-serif text-2xl uppercase tracking-widest">EAMA Garments</h1>
        <p class="text-[10px] text-gray-500 tracking-[0.2em] uppercase">Enterprise Portal</p>
    </header>

    <main class="w-full max-w-md px-6 z-10" id="recovery-container">
        <div class="bg-[#121212] border border-white/10 p-12 rounded-lg text-center shadow-2xl">
            <div class="w-16 h-16 rounded-full border border-[#ffb4a3]/20 flex items-center justify-center mx-auto mb-8">
                <span class="material-symbols-outlined text-[#ffb4a3] text-3xl">lock_reset</span>
            </div>
            <h2 class="text-3xl font-serif mb-4">Reset Password</h2>
            <p class="text-gray-500 text-sm mb-8">Enter your registered email address to receive instructions.</p>

            <form id="recovery-form" class="space-y-6">
                <div class="text-left">
                    <label class="text-[10px] uppercase text-gray-500 block mb-2">Email Address</label>
                    <input id="email" type="email" class="w-full bg-black border border-white/10 p-4 rounded text-white focus:border-[#ffb4a3] outline-none" placeholder="e.g. procurement@company.com" required>
                </div>
                <button type="submit" id="btn" class="w-full bg-[#ffb4a3] text-[#3d0600] font-bold py-4 uppercase tracking-widest hover:bg-white transition-all">Send Reset Link</button>
            </form>

            <div class="mt-10">
                <a href="../client_portal_sign_in/code.html" class="text-xs text-gray-500 uppercase tracking-widest hover:text-white flex items-center justify-center gap-2">
                    <span class="material-symbols-outlined text-sm">keyboard_backspace</span> Back to Login
                </a>
            </div>
        </div>
    </main>

    <script>
        document.getElementById('recovery-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const btn = document.getElementById('btn');
    
    btn.disabled = true; 
    btn.innerText = "Processing...";

    try {
        // 1. We call the function
        // 2. We use type: 'recovery' to match the Edge Function logic
        const { data, error } = await eamaSupabase.functions.invoke('send-auth-email', {
            body: { 
                email: email, 
                type: 'recovery' 
            }
        });
        
        if (error) throw error;

        // Success UI
        document.getElementById('recovery-container').innerHTML = `
            <div class="bg-[#121212] border border-white/10 p-12 rounded-lg text-center shadow-2xl">
                <span class="material-symbols-outlined text-green-500 text-6xl mb-6">check_circle</span>
                <h2 class="text-2xl font-serif mb-4">Check Your Inbox</h2>
                <p class="text-gray-400">We have sent a secure password reset link to <br><span class="text-white">${email}</span>.</p>
                <a href="../client_portal_sign_in/code.html" class="mt-8 inline-block text-[#ffb4a3] text-xs uppercase tracking-widest hover:text-white transition-all">
                    Return to Login
                </a>
            </div>`;
            
    } catch (err) {
        console.error("Recovery Error:", err);
        alert("Error: " + (err.message || "Could not send reset link. Please try again."));
        btn.disabled = false; 
        btn.innerText = "Send Reset Link";
    }
});
    </script>
</body>
</html>
