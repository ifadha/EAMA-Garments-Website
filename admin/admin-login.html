<body class="bg-background text-on-surface font-body-md overflow-hidden h-screen">
<!-- Main Auth Shell -->
<main class="relative h-full w-full flex items-center justify-center login-backdrop">
<!-- Header / Logo Overlay -->
<header class="fixed top-0 left-0 w-full flex justify-between items-center px-margin-mobile md:px-margin-desktop h-24 z-50">
<div class="font-headline-md text-headline-md tracking-tighter text-on-surface flex items-center gap-2">
<span class="material-symbols-outlined text-primary" data-icon="factory">factory</span>
                EAMA Garments
            </div>
<div class="hidden md:flex gap-8">
<span class="font-label-caps text-label-caps text-on-secondary-fixed-variant opacity-60">System Version 4.2.0</span>
</div>
</header>
<!-- Centered Login Container -->
<div class="w-full max-w-md px-margin-mobile z-10 animate-subtle">
<div class="bg-surface-container-low border-subtle p-8 md:p-12 relative overflow-hidden">
<!-- Top Decorative Bar -->
<div class="absolute top-0 left-0 w-full h-1 bg-primary/20"></div>
<div class="absolute top-0 left-0 w-1/3 h-1 bg-primary"></div>
<!-- Branding & Title -->
<div class="mb-10">
<h1 class="font-headline-sm text-headline-sm mb-2 text-on-surface tracking-wide">Secure Access</h1>
<p class="font-label-caps text-label-caps text-primary uppercase tracking-[0.2em] mb-6">Authorized EAMA personnel only.</p>
</div>
<!-- Form -->
<form class="space-y-8" id="admin-login-form" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="space-y-2">
<label class="font-label-caps text-label-caps text-secondary opacity-80 flex items-center gap-2" for="email">
<span class="material-symbols-outlined text-[14px]" data-icon="alternate_email">alternate_email</span>
                            Corporate Email
                        </label>
<input class="w-full bg-surface-container-highest border-transparent py-4 px-4 text-on-surface font-body-md input-focus-effect transition-all duration-300" id="email" name="email" placeholder="username@eama.com" required="" type="email"/>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="font-label-caps text-label-caps text-secondary opacity-80 flex items-center gap-2" for="password">
<span class="material-symbols-outlined text-[14px]" data-icon="lock">lock</span>
                                Security Key
                            </label>
<a class="font-label-caps text-label-caps text-primary hover:underline transition-all" href="#">Forgot?</a>
</div>
<input class="w-full bg-surface-container-highest border-transparent py-4 px-4 text-on-surface font-body-md input-focus-effect transition-all duration-300" id="password" name="password" placeholder="••••••••••••" required="" type="password"/>
</div>
<!-- Security Verification Prompt (Ghost UI) -->
<div class="flex items-center gap-3 p-4 bg-primary/5 border border-primary/10 rounded-sm">
<span class="material-symbols-outlined text-primary text-[18px]" data-icon="verified_user">verified_user</span>
<p class="text-[11px] font-label-caps text-secondary leading-tight">
                            Connection encrypted. 2FA may be required for global network access.
                        </p>
</div>
<!-- Primary Action -->
<button class="w-full bg-primary-container hover:bg-primary text-on-primary-container font-label-caps py-5 transition-all duration-300 uppercase tracking-widest flex items-center justify-center gap-3" type="submit">
                        Access Admin Dashboard
                        <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>

<p class="font-label-caps text-[10px] text-secondary opacity-40 uppercase tracking-widest">
                    Industrial Integrity &amp; Compliance © 2024 EAMA Garments
                </p>
</div>
</div>
<!-- Ambient Security Glow (Bottom Right) -->
<div class="fixed bottom-0 right-0 w-96 h-96 bg-primary/5 blur-[120px] rounded-full pointer-events-none"></div>
</main>
<!-- Footer Component (Mandated Shell) -->
<!-- Note: Following the "Destination Rule" filter, the Footer is suppressed on Login/Transactional pages to prioritize the Canvas. -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-client.js"></script>
<script>

const loginBtn = document.querySelector('button[type="submit"]');
const form = document.getElementById('admin-login-form');

if (form) {

    form.addEventListener('submit', async function(event) {

        event.preventDefault();

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;


        if (!window.eamaSupabase) {
            alert("Supabase is not connected.");
            return;
        }


        const { data, error } = await window.eamaSupabase.auth.signInWithPassword({
            email: email,
            password: password
        });


        if (error) {
            console.error(error);
            alert("Invalid admin credentials.");
            return;
        }


        // Login successful

        localStorage.setItem(
            "eama_admin_session",
            JSON.stringify(data.user)
        );


        window.location.href = "admin-dashboard.html";

    });

}

</script>
